name: agent-web

services:
  search:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-agent-web-local-search-only}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.selfhost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.selfhost}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.selfhost}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      search:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.selfhost}
      CREDENTIAL_MASTER_KEY: ${CREDENTIAL_MASTER_KEY:?Set CREDENTIAL_MASTER_KEY in .env.selfhost}
      AI_ALLOW_INSECURE_HTTP: ${AI_ALLOW_INSECURE_HTTP:-false}
      AI_TOKEN_PRICES_JSON: ${AI_TOKEN_PRICES_JSON:-[]}
      AI_MAX_INPUT_CHARACTERS: ${AI_MAX_INPUT_CHARACTERS:-160000}
      AI_OUTPUT_TOKEN_PARAMETER: ${AI_OUTPUT_TOKEN_PARAMETER:-auto}
      AI_OUTPUT_TOKEN_BUDGETS_JSON: ${AI_OUTPUT_TOKEN_BUDGETS_JSON:-}
      WEB_SEARCH_BASE_URL: ${WEB_SEARCH_BASE_URL:-http://search:8080/}
      MOBILE_ALLOWED_ORIGINS: ${MOBILE_ALLOWED_ORIGINS:-https://localhost}
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/v1/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      search:
        condition: service_started
    entrypoint: ["./worker-entrypoint.sh"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.selfhost}
      CREDENTIAL_MASTER_KEY: ${CREDENTIAL_MASTER_KEY:?Set CREDENTIAL_MASTER_KEY in .env.selfhost}
      AI_ALLOW_INSECURE_HTTP: ${AI_ALLOW_INSECURE_HTTP:-false}
      AI_TOKEN_PRICES_JSON: ${AI_TOKEN_PRICES_JSON:-[]}
      AI_MAX_INPUT_CHARACTERS: ${AI_MAX_INPUT_CHARACTERS:-160000}
      AI_OUTPUT_TOKEN_PARAMETER: ${AI_OUTPUT_TOKEN_PARAMETER:-auto}
      AI_OUTPUT_TOKEN_BUDGETS_JSON: ${AI_OUTPUT_TOKEN_BUDGETS_JSON:-}
      WEB_SEARCH_BASE_URL: ${WEB_SEARCH_BASE_URL:-http://search:8080/}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      REMINDER_WORKER_ID: ${REMINDER_WORKER_ID:-}
      REMINDER_POLL_INTERVAL_MS: ${REMINDER_POLL_INTERVAL_MS:-5000}
      PROACTIVITY_POLL_INTERVAL_MS: ${PROACTIVITY_POLL_INTERVAL_MS:-60000}
      SCHEDULER_BATCH_SIZE: ${SCHEDULER_BATCH_SIZE:-20}
      SCHEDULER_LEASE_MS: ${SCHEDULER_LEASE_MS:-60000}
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  searxng-cache:
