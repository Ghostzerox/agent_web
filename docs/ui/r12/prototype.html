<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R12 交互原型 · 非运行应用</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#25303b;font:16px/1.7 system-ui,sans-serif}button,a,select,input,textarea{font:inherit}button,a,select{min-height:44px}button,a{cursor:pointer}button{border:1px solid #dce2e8;border-radius:10px;background:white;padding:8px 16px;color:inherit}.primary{background:#315e55;color:white;border-color:#315e55}.muted{color:#647181;font-size:14px}.shell{display:grid;grid-template-columns:190px 1fr;min-height:100vh}aside{padding:24px;border-right:1px solid #dce2e8;background:white}aside a{display:block;padding:10px;color:inherit;text-decoration:none}header{padding:16px 28px;border-bottom:1px solid #dce2e8;background:white;display:flex;justify-content:space-between}main{padding:32px;max-width:1000px;margin:auto}h1{font-size:28px;margin:0}nav{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0}nav button[aria-pressed=true]{background:#e5efeb;color:#315e55;border-color:#b0cbbd}.panel{background:white;border:1px solid #dce2e8;border-radius:16px;padding:28px}label{display:block;margin:16px 0;font-size:14px}input,textarea,select{width:100%;border:1px solid #dce2e8;border-radius:8px;background:white;padding:12px}footer{margin-top:24px;padding:16px;border-top:1px solid #dce2e8;display:flex;align-items:center;justify-content:space-between;gap:12px}.mobile{display:none}#tasks{display:none}summary{cursor:pointer;padding:10px 0}button:focus-visible,a:focus-visible{outline:3px solid #315e55;outline-offset:3px}@media(max-width:700px){.shell{display:block}aside{display:none}header{padding:12px 16px}main{padding:20px 16px}.panel{padding:20px}nav{display:none}.mobile{display:block}footer{position:sticky;bottom:0;background:#f7f8fa;padding-bottom:max(16px,env(safe-area-inset-bottom))}h1{font-size:24px}}
</style>
<div class="shell"><aside><h2>知伴</h2><a href="#" onclick="show(false);return false">对话</a><a href="#" onclick="show(true);return false">任务</a><a href="#">学习</a><a href="#" onclick="show(false);return false">娱乐</a><a href="#">内容</a><a href="#">收件箱</a><a href="#">设置</a></aside><div><header><span>娱乐 / 我的世界</span><span class="muted">原型，不连接服务端</span></header><main><div id="world"><p class="muted">1 描述世界 → 2 完善设定 → 3 检查与开始</p><h1>潮汐港</h1><p class="muted">先把世界写清楚，再开始属于你的旅程。</p><nav aria-label="创作分区"><button aria-pressed="true">世界设定</button><button>区域与地图</button><button>人物与社会</button><button>道具与事件</button><button>检查与发布</button></nav><label class="mobile">当前分区<select><option>世界设定</option><option>区域与地图</option><option>人物与社会</option><option>道具与事件</option><option>检查与发布</option></select></label><section class="panel"><h2>世界概览</h2><label>名称<input value="潮汐港"></label><label>世界前提<textarea rows="5">一座没有魔法的海边城市，人们以手艺和航海为生。你可以选择自己的身份与生活方向。</textarea></label><details><summary>文化、势力与历史</summary>只展开本次想完善的内容。</details><details><summary>高级资料</summary>保护当前部分、作者资料与结构编辑按需打开。</details></section><footer><span class="muted">未保存更改</span><div><button>生成此部分</button> <button class="primary">保存更改</button></div></footer></div><div id="tasks"><p class="muted">任务 / 今天</p><h1>今天，先做一件事</h1><nav><button aria-pressed="true">今天</button><button>习惯</button><button>目标</button><button>提醒</button></nav><section class="panel"><h2>添加一个待办</h2><label>行动名称<input placeholder="例如：读20分钟书"></label><details><summary>截止日期与备注（可选）</summary><input type="date"><textarea placeholder="补充说明"></textarea></details><button class="primary">添加待办</button><p class="muted">完成行动与提醒送达分别记录。</p></section></div></main></div></div>
<script>function show(tasks){document.querySelector('#world').style.display=tasks?'none':'block';document.querySelector('#tasks').style.display=tasks?'block':'none'}document.querySelectorAll('nav button').forEach(button=>button.onclick=()=>{button.parentNode.querySelectorAll('button').forEach(other=>other.setAttribute('aria-pressed',String(other===button)))})</script></html>
